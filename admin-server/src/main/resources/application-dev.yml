spring:
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      url: jdbc:mysql://localhost:3306/admin_platform
      username: ${DB_USERNAME:root}
      password: ${DB_PASSWORD:Abcd1234!.}
      driver-class-name: com.mysql.cj.jdbc.Driver

      # 初始连接数
      initial-size: 1
      # 最小连接池数量
      min-idle: 1
      # 最大连接池数量
      max-active: 10
      # 配置获取连接等待超时的时间
      max-wait: 60000
      # 配置连接超时时间
      connect-timeout: 30000
      # 配置网络超时时间
      socket-timeout: 60000
      # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
      time-between-eviction-runs-millis: 60000
      # 配置一个连接在池中最小生存的时间，单位是毫秒
      min-evictable-idle-time-millis: 300000
      # 配置一个连接在池中最大生存的时间，单位是毫秒
      max-evictable-idle-time-millis: 900000
      # 配置检测连接是否有效
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        # 控制台管理用户名和密码
        login-username: admin
        login-password: 123456
      filter:
        stat:
          enabled: true
          # 慢SQL记录
          log-slow-sql: true
          slow-sql-millis: 1000
          merge-sql: true

  # Redis服务器连接
  data:
    redis:
      # 地址
      host: localhost
      # 端口，默认为6379
      port: 6379
      # 数据库索引
      database: 0
      # 密码
      password:
      # 连接超时时间
      timeout: 10s
  # Spring Cache 缓存规则
  cache:
    type: redis
 

scalar:
  enabled: true

# 日志配置
logging:
  level:
    # 全局默认级别
    root: info
    # 项目的日志级别
    dev.geo.admin: debug
    org.springframework.security: DEBUG
    org.springframework.security.oauth2.server.resource: DEBUG
    dev.geo.admin.security: DEBUG

# 调度器相关配置
ds:
  # 资源中心路径
  resource_url: /dolphinscheduler/
  # hdfs相关配置
  hdfs:
    #NameNode RPC地址（客户端连接 HDFS 的入口地址）
    url: hdfs://127.0.0.1:9000