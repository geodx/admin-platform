app:
  # 名称
  name: Admin Platform
  # 版本
  version: 0.1.0-SNAPSHOT
  # author
  author: geoearth.dev
  # description
  description: Admin Platform
  # 版权年份
  copyright-year: 2026
  # 文件路径 示例（ Windows配置D:/data/uploadPath，Linux配置 /home/data/uploadPath）
  profile: ${user.dir}/upload/
  # 获取ip地址开关
  address-enabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captcha-type: math

server:
  port: 8080


spring:
  application:
    name: admin-platform
  profiles:
    default: dev
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
    encoding: UTF-8
  config:
    import:
      # 引入业务模块配置文件
      - optional:classpath:application-system.yml
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
#  jackson:
#    property-naming-strategy: SNAKE_CASE

# MyBatis Plus配置
mybatis-plus:
  # Mapper XML文件位置
  mapper-locations: classpath*:/mapper/**/*Mapper.xml
  # 实体类别名包
  type-aliases-package: dev.geo.admin.system.model.system.entity,dev.geo.admin.system.model.monitor.entity,dev.geo.admin.system.model.message.entity
  configuration:
    # 转换驼峰命名
    map-underscore-to-camel-case: true
    # 使用 SLF4J，是否输出 SQL 由 Mapper 日志级别控制
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    # 关闭MyBatis-Plus启动Banner
    banner: false
    db-config:
      # 主键类型 AUTO 自增 NONE 空 INPUT 用户输入 ASSIGN_ID 雪花 ASSIGN_UUID 唯一 UUID
      id-type: ASSIGN_ID
      logic-delete-field: delFlag
      logic-not-delete-value: "0"
      logic-delete-value: "1"
# MyBatis Plus Join配置
mybatis-plus-join:
  banner: false
scalar:
  enabled: false
  path: /api
  url: /v3/api-docs
  page-title: Admin后台接口文档
  favicon: /favicon.ico
  # 隐藏开发者工具 always localhost never
  show-developer-tools: never
  default-http-client:
    target-key: node
    client-key: axios
  agent:
    disabled: true
  # 隐藏Models数据模型区域
  #  hide-models: true
  # 隐藏“打开API客户端”按钮
  hide-client-button: true
  document-download-type: none
  custom-css: |
    .items-center a[href="https://www.scalar.com"]{
      display: none !important;
    }

# 日志配置
logging:
  level:
    # 全局默认级别
    root: INFO
    dev.geo.admin: debug
    org.springframework: warn

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*
